[package]
name = "huffman-cli"
version = "0.1.0"
edition = "2021"
description = "A small Huffman coding compressor and decompressor for text files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shivamkarna/huffman-cli"
readme = "README.md"
keywords = ["huffman", "compression", "cli"]
categories = ["command-line-utilities", "compression"]
exclude = [".github/"]

[[bin]]
name = "huff"
path = "src/main.rs"
